<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vorlauf-Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --ink: #1d1c1a; --muted: #6b6760; --line: #e3dfd8;
    --warm: #d9541e; --warm-soft: #fbe6dc; --cold: #2f6fb0; --cold-soft: #dde9f6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1e1d1b; --ink: #ecebe7; --muted: #9a968e; --line: #2e2c29;
      --warm: #f07a45; --warm-soft: #3a2218; --cold: #6aa4e0; --cold-soft: #182635; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1e1d1b; --ink: #ecebe7; --muted: #9a968e; --line: #2e2c29;
    --warm: #f07a45; --warm-soft: #3a2218; --cold: #6aa4e0; --cold-soft: #182635; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .meta { color: var(--muted); font-size: 13px; }
  .banner { border: 1px dashed var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .banner strong { color: var(--ink); }

  .hero { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
          display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: center; margin-bottom: 16px; position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--warm); }
  .hero.cold::before { background: var(--cold); }
  .hero .label { color: var(--muted); font-size: 13px; }
  .hero .temp { font: 500 56px/1.05 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: -.03em; margin: 2px 0 8px; }
  .hero .temp small { font-size: 22px; color: var(--muted); }
  .hero .status { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 99px; background: var(--warm-soft); color: var(--warm); }
  .hero.cold .pill { background: var(--cold-soft); color: var(--cold); }
  .today { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 20px; text-align: right; }
  .today .k { font-size: 12px; color: var(--muted); }
  .today .v { font: 500 18px/1.2 "IBM Plex Mono", ui-monospace, monospace; }
  .today .head { grid-column: 1 / -1; font-size: 12px; color: var(--muted); text-align: right; }
  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; }
    .today, .today .head { text-align: left; }
  }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .panel-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .chart-box { position: relative; height: 320px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .summary .k { font-size: 12px; color: var(--muted); }
  .summary .v { font: 500 18px/1.3 "IBM Plex Mono", ui-monospace, monospace; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 120px 0; }

  .login { max-width: 380px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); }
  .login h1 { margin-bottom: 8px; }
  .login p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .err { color: var(--warm); font-size: 13px; margin-top: 10px; min-height: 1em; }
  footer { margin-top: 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); }
  footer button { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="login" hidden>
    <h1>Vorlauf-Monitor</h1>
    <p>Gib deinen Zugangsschlüssel ein. Er wird nur in diesem Browser gespeichert.</p>
    <input id="keyInput" type="password" autocomplete="current-password" placeholder="Zugangsschlüssel">
    <div class="btns">
      <button class="btn" id="keySubmit">Anmelden</button>
      <button class="btn ghost" id="demoBtn">Demo ansehen</button>
    </div>
    <div class="err" id="loginErr"></div>
  </section>

  <section id="app" hidden>
    <header>
      <h1>Vorlauf-Monitor</h1>
      <span class="meta" id="updated"></span>
    </header>
    <div class="banner" id="demoBanner" hidden><strong>Demo-Modus:</strong> simulierte Werte. Echte Daten erscheinen, sobald Home Assistant sendet.</div>

    <div class="hero" id="hero">
      <div>
        <div class="label" id="sensorName">Vorlauf Wohnung</div>
        <div class="temp" id="temp">–</div>
        <div class="status"><span class="pill" id="pill">warm</span><span id="battery"></span></div>
      </div>
      <div class="today">
        <div class="head">Heute</div>
        <div><div class="k">Min</div><div class="v" id="tMin">–</div></div>
        <div><div class="k">Ø</div><div class="v" id="tAvg">–</div></div>
        <div><div class="k">Max</div><div class="v" id="tMax">–</div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 id="chartTitle">Verlauf</h2>
        <div class="seg" role="group" aria-label="Zeitraum">
          <button data-range="day" aria-pressed="true">24 h</button>
          <button data-range="week" aria-pressed="false">7 Tage</button>
          <button data-range="month" aria-pressed="false">Monat</button>
          <button data-range="year" aria-pressed="false">Jahr</button>
        </div>
      </div>
      <div class="chart-box"><canvas id="chart" aria-label="Temperaturverlauf des Vorlaufs"></canvas><div class="empty" id="empty" hidden>Für diesen Zeitraum gibt es noch keine Werte.</div></div>
      <div class="summary" id="summary"></div>
    </div>

    <footer>
      <span id="thresholdInfo"></span>
      <button id="logout">Abmelden</button>
    </footer>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
  const KEY_STORE = "heizung.viewKey";
  const store = {
    get() { try { return localStorage.getItem(KEY_STORE); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY_STORE, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY_STORE); } catch {} },
  };
  const $ = (id) => document.getElementById(id);
  const DAY = 24 * 3600e3;
  let data = null, chart = null, range = "day", refreshTimer = null;

  const dayFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Berlin" });
  const dayKey = (ts) => dayFmt.format(new Date(ts));
  const fmtT = (v) => v == null ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " °C";

  // ---------- Demo-Daten: ein Vorlauf-Sensor ----------
  function vorlaufAt(ts) {
    const d = new Date(ts);
    const h = d.getHours() + d.getMinutes() / 60;
    // Jahreszeit: Heizsaison Okt–Apr, im Hochsommer Heizung aus
    const doy = (ts - new Date(d.getFullYear(), 0, 1)) / DAY;
    const season = Math.min(1, Math.max(0, (Math.cos(((doy - 15) / 365) * 2 * Math.PI) + 0.35) / 1.35)); // 1 im Januar, 0 im Sommer
    const night = (h >= 22 || h < 5) ? 0.75 : 1; // Nachtabsenkung
    const base = 22 + (38 * season + 8) * night * (season > 0.08 ? 1 : 0);
    return base + Math.sin(ts / 2.7e6) * 1.8 + Math.sin(ts / 9.1e5) * 0.7;
  }
  function makeDemo() {
    const id = "vorlauf", now = Date.now(), history = [], dailyMap = {};
    for (let t = now - 365 * DAY; t <= now; t += 30 * 60e3) {
      const v = vorlaufAt(t), k = dayKey(t);
      const e = dailyMap[k] || (dailyMap[k] = { min: v, max: v, sum: 0, n: 0 });
      e.min = Math.min(e.min, v); e.max = Math.max(e.max, v); e.sum += v; e.n++;
    }
    for (let t = now - 7 * DAY; t <= now; t += 10 * 60e3) {
      history.push({ ts: t, values: { [id]: Math.round(vorlaufAt(t) * 10) / 10 } });
    }
    const r = (x) => Math.round(x * 10) / 10;
    const daily = Object.keys(dailyMap).sort().map((date) => {
      const e = dailyMap[date];
      return { date, values: { [id]: { min: r(e.min), max: r(e.max), avg: r(e.sum / e.n) } } };
    });
    const last = history[history.length - 1];
    return { latest: { ts: last.ts, threshold: 30, sensors: [{ id, name: "Vorlauf Wohnung", temperature: last.values[id], battery: 87 }] }, history, daily };
  }

  // ---------- Daten laden ----------
  async function load(key) {
    const res = await fetch("/api/readings", { headers: { "x-view-key": key }, cache: "no-store" });
    if (res.status === 401) throw new Error("unauthorized");
    if (res.status === 503) throw new Error("not_configured");
    if (res.status === 404) throw new Error("no_data");
    if (!res.ok) throw new Error("http_" + res.status);
    const d = await res.json();
    d.daily = d.daily || [];
    return d;
  }

  // ---------- Hilfen ----------
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function alpha(color, a) {
    const m = color.match(/^#([0-9a-f]{6})$/i);
    if (!m) return color;
    const n = parseInt(m[1], 16);
    return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`;
  }
  const sensor = () => data.latest.sensors[0];

  // ---------- Kopfbereich ----------
  function renderHero() {
    const s = sensor(), thr = data.latest.threshold;
    const cold = thr != null && s.temperature < thr;
    $("hero").classList.toggle("cold", cold);
    $("sensorName").textContent = s.name || "Vorlauf Wohnung";
    $("temp").textContent = s.temperature.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const unit = document.createElement("small"); unit.textContent = " °C"; $("temp").appendChild(unit);
    $("pill").textContent = cold ? "kühlt aus" : "warm";
    $("battery").textContent = s.battery != null ? `Batterie ${s.battery} %` : "";
    $("updated").textContent = "Stand: " + new Date(data.latest.ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    $("thresholdInfo").textContent = thr != null ? `Warnung unter ${thr} °C` : "";

    // Heute: aus Tageswerten, sonst aus dem Verlauf berechnen
    const today = data.daily.find((d) => d.date === dayKey(Date.now()))?.values[s.id];
    let t = today;
    if (!t) {
      const vals = data.history.filter((h) => dayKey(h.ts) === dayKey(Date.now())).map((h) => h.values[s.id]).filter((v) => v != null);
      if (vals.length) t = { min: Math.min(...vals), max: Math.max(...vals), avg: vals.reduce((a, b) => a + b, 0) / vals.length };
    }
    $("tMin").textContent = fmtT(t?.min); $("tAvg").textContent = fmtT(t?.avg); $("tMax").textContent = fmtT(t?.max);
  }

  // ---------- Diagramm ----------
  const TITLES = { day: "Letzte 24 Stunden", week: "Letzte 7 Tage", month: "Letzte 30 Tage – Tageswerte", year: "Letzte 12 Monate – Tageswerte" };

  function renderChart() {
    const s = sensor(), thr = data.latest.threshold;
    const warm = css("--warm"), muted = css("--muted"), grid = css("--line");
    let labels = [], datasets = [], summary = null;
    $("chartTitle").textContent = TITLES[range];

    if (range === "day" || range === "week") {
      const cutoff = Date.now() - (range === "day" ? 1 : 7) * DAY;
      const rows = data.history.filter((h) => h.ts >= cutoff && h.values[s.id] != null);
      labels = rows.map((h) => range === "day"
        ? new Date(h.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
        : new Date(h.ts).toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" }));
      datasets.push({ label: s.name, data: rows.map((h) => h.values[s.id]), borderColor: warm, backgroundColor: warm,
        borderWidth: 2, pointRadius: 0, tension: 0.3, spanGaps: true });
      const vals = rows.map((h) => h.values[s.id]);
      if (vals.length) summary = { avg: vals.reduce((a, b) => a + b, 0) / vals.length, min: Math.min(...vals), max: Math.max(...vals),
        below: thr != null ? Math.round(vals.filter((v) => v < thr).length / vals.length * 100) : null, belowUnit: "%" };
    } else {
      const days = range === "month" ? 30 : 365;
      const cutoff = dayKey(Date.now() - (days - 1) * DAY);
      const rows = data.daily.filter((d) => d.date >= cutoff && d.values[s.id]);
      labels = rows.map((d) => {
        const [y, m, dd] = d.date.split("-").map(Number);
        const dt = new Date(y, m - 1, dd);
        return range === "month" ? dt.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })
                                 : dt.toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "2-digit" });
      });
      const v = rows.map((d) => d.values[s.id]);
      datasets.push(
        { label: "Max", data: v.map((x) => x.max), borderColor: "transparent", backgroundColor: alpha(warm, 0.15), pointRadius: 0, fill: "+1", tension: 0.3 },
        { label: "Min", data: v.map((x) => x.min), borderColor: "transparent", backgroundColor: "transparent", pointRadius: 0, fill: false, tension: 0.3 },
        { label: "Tagesmittel", data: v.map((x) => x.avg), borderColor: warm, backgroundColor: warm, borderWidth: 2,
          pointRadius: range === "month" ? 2 : 0, tension: 0.3 },
      );
      if (v.length) summary = { avg: v.reduce((a, x) => a + x.avg, 0) / v.length, min: Math.min(...v.map((x) => x.min)), max: Math.max(...v.map((x) => x.max)),
        below: thr != null ? v.filter((x) => x.min < thr).length : null, belowUnit: " Tage" };
    }

    if (thr != null && labels.length) datasets.push({ label: "Grenzwert", data: labels.map(() => thr), borderColor: muted,
      borderDash: [4, 4], borderWidth: 1, pointRadius: 0, fill: false });

    const empty = labels.length === 0;
    $("empty").hidden = !empty; $("chart").hidden = empty;
    renderSummary(summary);
    if (chart) { chart.destroy(); chart = null; }
    if (empty) return;

    chart = new Chart($("chart"), {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: { ticks: { color: muted, maxTicksLimit: range === "year" ? 12 : 8, autoSkip: true, maxRotation: 0 }, grid: { display: false } },
          y: { ticks: { color: muted, callback: (v) => v + " °C" }, grid: { color: grid } },
        },
        plugins: {
          legend: { labels: { color: muted, boxWidth: 12, boxHeight: 2, filter: (i) => i.text !== "Max" && i.text !== "Min" } },
          tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.y?.toFixed(1)} °C` } },
        },
      },
    });
  }

  function renderSummary(s) {
    const box = $("summary");
    box.textContent = "";
    if (!s) { box.hidden = true; return; }
    box.hidden = false;
    const items = [["Durchschnitt", fmtT(s.avg)], ["Minimum", fmtT(s.min)], ["Maximum", fmtT(s.max)]];
    if (s.below != null) items.push([range === "month" || range === "year" ? "Tage mit Auskühlung" : "Zeit unter Grenzwert", s.below + s.belowUnit]);
    for (const [k, v] of items) {
      const el = document.createElement("div");
      const kk = document.createElement("div"); kk.className = "k"; kk.textContent = k;
      const vv = document.createElement("div"); vv.className = "v"; vv.textContent = v;
      el.append(kk, vv); box.appendChild(el);
    }
  }

  function render() { renderHero(); renderChart(); }

  // ---------- Ablauf ----------
  function showApp(d, isDemo) {
    data = d;
    $("login").hidden = true; $("app").hidden = false;
    $("demoBanner").hidden = !isDemo;
    render();
  }
  function showLogin(msg) {
    clearInterval(refreshTimer);
    $("app").hidden = true; $("login").hidden = false;
    $("loginErr").textContent = msg || "";
  }
  async function start(key) {
    try {
      const d = await load(key);
      store.set(key);
      showApp(d, false);
      clearInterval(refreshTimer);
      refreshTimer = setInterval(async () => { try { data = await load(key); render(); } catch {} }, 60000);
    } catch (e) {
      if (e.message === "unauthorized") { store.clear(); showLogin("Schlüssel stimmt nicht."); }
      else if (e.message === "no_data") showLogin("Angemeldet, aber noch keine Messwerte vorhanden. Schau dir solange die Demo an.");
      else if (e.message === "not_configured") showLogin("Die Seite ist noch nicht eingerichtet. Schau dir solange die Demo an.");
      else showLogin("Verbindung fehlgeschlagen.");
    }
  }

  $("keySubmit").addEventListener("click", () => { const k = $("keyInput").value.trim(); if (k) start(k); });
  $("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("keySubmit").click(); });
  $("demoBtn").addEventListener("click", () => showApp(makeDemo(), true));
  $("logout").addEventListener("click", () => { store.clear(); showLogin(); });
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    range = b.dataset.range;
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderChart();
  }));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => data && renderChart());

  const params = new URLSearchParams(location.search);
  if (params.has("demo")) showApp(makeDemo(), true);
  else { const saved = store.get(); saved ? start(saved) : showLogin(); }
})();
</script>
</body>
</html>
